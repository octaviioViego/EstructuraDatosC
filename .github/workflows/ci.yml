#Nombre de la acción
name: Integracion continua

# Sección de eventos que activan el flujo de trabajo
# Aquí se activa cuando se hace un push al repositorio
on: 
  push

# Permisos para el flujo de trabajo
jobs:
    compilar-ejecutar:
        runs-on: ubuntu-22.04
        steps:
          - name: Clonar repositorio
            uses: actions/checkout@v4
        
          - name: Compilar código
            run: gcc ejercicios.c -o ejercicios
          - name: Ejecutar programa
            run: ./ejercicios
          
          - name: Compilar código listas ligadas
            run: gcc listasLigadas.c -o ejelistasligada
          - name: Ejecutar programa listas ligadas
            run: ./ejelistasligada

          - name: Compilar código listas ligadas dobles
            run: gcc listasLigadasDobles.c -o ejelistasligadaDoble
          - name: Ejecutar programa listas ligadas doble
            run: ./ejelistasligadaDoble

          - name: Compilar código grafos
            run: gcc grafos.c -o grafos
          - name: Ejecutar programa grafos
            run: ./grafos
          
          - name: Compilar código grafosLA
            run: gcc grafosLA.c -o grafosLA
          - name: Ejecutar programa grafosLA
            run: ./grafosLA
  